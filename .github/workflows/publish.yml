name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      npm_tag:
        description: npm distribution tag
        required: true
        default: latest
        type: choice
        options: [latest, beta]

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Validate release
        run: |
          npm run check
          npm test
          npm run verify:package
          npm pack --dry-run
      - name: Verify release tag matches package version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node scripts/verify-package.js --tag "$RELEASE_TAG"
      - name: Refuse to republish an existing version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "signalk-to-stalk@$VERSION" version >/dev/null 2>&1; then
            echo "signalk-to-stalk@$VERSION is already published" >&2
            exit 1
          fi
      - name: Publish release
        if: github.event_name == 'release'
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish manual run
        if: github.event_name == 'workflow_dispatch'
        run: npm publish --access public --provenance --tag "$NPM_TAG"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TAG: ${{ inputs.npm_tag }}
